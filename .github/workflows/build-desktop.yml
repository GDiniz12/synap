name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: Linux (AppImage & deb)
            flags: --linux
          - os: windows-latest
            target: Windows (NSIS Setup .exe)
            flags: --win
          - os: macos-latest
            target: macOS (DMG)
            flags: --mac

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install Desktop Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      - name: Build Electron App & Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.flags }} --publish always
